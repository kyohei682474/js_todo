<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Todo App</title>
    <!-- 1. CSSファイルを読み込み -->
    <link
      href="index.css"
      rel="stylesheet"
    />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  </head>
  <body>
    <!-- 2. class属性をCSSのために指定 -->
    <div class="todoapp ">
      <!-- 3. id属性をJavaScriptのために指定 -->
      <form id="js-form" class="d-flex gap-2 mb-3 mt-3">
        <input
          id="js-form-input"
          class="new-todo"
          type="text"
          placeholder="What need to be done?"
          autocomplete="off"
        />
        <div class="todo-actions d-flex gap-2 ">
          <button class="btn btn-primary btn-sm ">保存</button>
        </div>

      </form>
      
      <!-- 4. TodoアプリのメインとなるTodoリスト -->
      <div id="js-todo-list" class="todo-list">
        <!-- 動的に更新されるTodoリスト -->
      </div>
      <footer class="footer">
        <!-- 5. Todoアイテム数の表示 -->
       
        <!-- todoItemCountElement = document.querySelector("#js-todo-count"); -->
        <span id="js-todo-count" class="todo-item-count">全てのタスク: 0 完了タスク: 0 未完了タスク: 0</span>
      </footer>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
